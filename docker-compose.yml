name: agilecortex

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST + dashboard : http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
    # GPU NVIDIA (optionnel) : décommenter
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  api:
    build: ./backend
    env_file: .env
    environment:
      # Dans Docker, les services se joignent par leur nom, pas par localhost
      OLLAMA_BASE_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app          # hot reload en développement
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
    restart: unless-stopped

  # Streamlit sera ajouté ici quand le frontend sera prêt :
  # frontend:
  #   build: ./frontend
  #   environment:
  #     API_BASE_URL: http://api:8000
  #   ports:
  #     - "8501:8501"
  #   depends_on:
  #     - api

volumes:
  qdrant_data:
  ollama_data:
